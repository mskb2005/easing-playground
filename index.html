<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#030014;overflow:hidden;touch-action:none}canvas{width:100vw;height:100vh;display:block}h1{position:fixed;top:14px;left:14px;color:#fff;font-family:Arial;font-size:22px}h1 span{color:#22d3ee}</style></head>
<body><h1>MOTIONIC<span>.</span></h1><canvas id=c></canvas>
<script>
c=document.getElementById('c');x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
b={x:200,y:200,vx:3,vy:3,r:36,g:false};t=[];
c.onpointerdown=e=>{d=Math.hypot(e.clientX-b.x,e.clientY-b.y);if(d<80)b.g=true;else{b.x=e.clientX;b.y=e.clientY;}};
onpointermove=e=>{if(b.g){b.x=e.clientX;b.y=e.clientY;}};
onpointerup=()=>b.g=false;
function f(){x.fillStyle='rgba(3,0,20,.3)';x.fillRect(0,0,c.width,c.height);
if(!b.g){b.x+=b.vx;b.y+=b.vy;b.vy+=.1;if(b.x<36||b.x>c.width-36)b.vx*=-1;if(b.y<36||b.y>c.height-36)b.vy*=-1;}
t.push({x:b.x,y:b.y});if(t.length>20)t.shift();
t.forEach((p,i)=>{x.globalAlpha=i/20*.6;x.fillStyle='#22d3ee';x.beginPath();x.arc(p.x,p.y,36*i/20,0,7);x.fill();});x.globalAlpha=1;
x.fillStyle='#22d3ee';x.shadowBlur=30;x.shadowColor='#22d3ee';x.beginPath();x.arc(b.x,b.y,36,0,7);x.fill();x.shadowBlur=0;
x.fillStyle='#fff';x.font='24px Arial';x.textAlign='center';x.fillText('🪐',b.x,b.y+8);
requestAnimationFrame(f);}f();
</script></body></html>
