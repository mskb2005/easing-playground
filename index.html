<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MOTIONIC UNIVERSE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;overflow:hidden}
body{background:#020617;color:white;font-family:Arial,sans-serif;height:100dvh;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;top:14px;left:0;right:0;text-align:center;pointer-events:none;z-index:10}
.top h1{font-size:28px;letter-spacing:6px;text-shadow:0 0 20px #22d3ee} .top h1 span{color:#22d3ee}
.top p{font-size:12px;color:#94a3b8;margin-top:4px}
.hint{position:fixed;bottom:110px;left:0;right:0;text-align:center;font-size:13px;color:#cbd5e1;pointer-events:none;z-index:10;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.dock{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;background:rgba(15,23,42,.85);backdrop-filter:blur(10px);padding:10px;border-radius:100px;border:1px solid #334155;z-index:10}
.dock button{border:none;padding:12px 14px;border-radius:100px;font-size:18px;cursor:pointer;background:#1e293b;color:white}
.dock button.active{background:#22d3ee;color:#020617}
.score{position:fixed;top:14px;right:14px;background:rgba(15,23,42,.8);padding:8px 14px;border-radius:100px;font-size:13px;border:1px solid #334155;z-index:10}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><h1>MOTIONIC <span>UNIVERSE</span></h1><p>Grab • Throw • Explode</p></div>
<div class="score">💥 Explosions: <b id="score">0</b> &nbsp; 🎯 Bounces: <b id="bounce">0</b></div>
<div class="hint" id="hint">👆 Drag the planet, throw it fast!</div>
<div class="dock">
<button onclick="setMode('trail',this)" class="active">🌈 Trail</button>
<button onclick="setMode('fire',this)">🔥 Fire</button>
<button onclick="setMode('ice',this)">❄️ Ice</button>
<button onclick="explode()">💥 Boom</button>
<button onclick="reset()">🔄</button>
</div>
<script>
let cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H; function resize(){W=cv.width=innerWidth; H=cv.height=innerHeight;} resize(); addEventListener('resize',resize);
let stars=Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+0.5,v:Math.random()*0.3+0.1}));
let ball={x:innerWidth/2,y:innerHeight/2,vx:2,vy:2,r:34,grab:false};
let trail=[], parts=[], score=0, bounce=0, mode='trail';
let colors={trail:['#22d3ee','#a855f7','#f472b6','#facc15'],fire:['#f97316','#ef4444','#facc15'],ice:['#67e8f9','#93c5fd','#ffffff']};
function setMode(m,btn){mode=m; document.querySelectorAll('.dock button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');}
function explode(x=ball.x,y=ball.y){
  score++; document.getElementById('score').textContent=score;
  let cols=colors[mode];
  for(let i=0;i<60;i++){let a=Math.random()*Math.PI*2, s=Math.random()*8+2; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*5+2});}
  if(navigator.vibrate) navigator.vibrate(60);
}
function reset(){ball.x=W/2; ball.y=H/2; ball.vx=3; ball.vy=3; trail=[]; parts=[];}
let px=0,py=0;
cv.addEventListener('pointerdown',e=>{let d=Math.hypot(e.clientX-ball.x,e.clientY-ball.y); if(d<70){ball.grab=true; document.getElementById('hint').textContent='Now FLING it!';} else explode(e.clientX,e.clientY);});
addEventListener('pointermove',e=>{if(ball.grab){let nx=e.clientX, ny=e.clientY; ball.vx=(nx-ball.x)*0.35; ball.vy=(ny-ball.y)*0.35; ball.x=nx; ball.y=ny;}});
addEventListener('pointerup',()=>{ball.grab=false; document.getElementById('hint').textContent='👆 Drag the planet, throw it fast!';});
function loop(){
  ctx.fillStyle='rgba(2,6,23,0.35)'; ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{s.y+=s.v; if(s.y>H)s.y=0; ctx.fillStyle='white'; ctx.globalAlpha=0.7; ctx.fillRect(s.x,s.y,s.s,s.s); ctx.globalAlpha=1;});
  if(!ball.grab){ball.x+=ball.vx; ball.y+=ball.vy; ball.vx*=0.995; ball.vy*=0.995; ball.vy+=0.08;}
  if(ball.x<ball.r){ball.x=ball.r; ball.vx*=-1; bounce++; explode(ball.x,ball.y);}
  if(ball.x>W-ball.r){ball.x=W-ball.r; ball.vx*=-1; bounce++; explode(ball.x,ball.y);}
  if(ball.y<ball.r+60){ball.y=ball.r+60; ball.vy*=-1; bounce++;}
  if(ball.y>H-ball.r){ball.y=H-ball.r; ball.vy*=-0.85; ball.vx*=0.98; bounce++; explode(ball.x,ball.y);}
  document.getElementById('bounce').textContent=bounce;
  trail.push({x:ball.x,y:ball.y,c:colors[mode][Math.floor(Math.random()*colors[mode].length)]}); if(trail.length>35) trail.shift();
  trail.forEach((t,i)=>{ctx.globalAlpha=i/trail.length*0.8; ctx.fillStyle=t.c; ctx.beginPath(); ctx.arc(t.x,t.y,ball.r*(i/trail.length)*0.9,0,Math.PI*2); ctx.fill();});
  ctx.globalAlpha=1;
  // planet
  let g=ctx.createRadialGradient(ball.x-10,ball.y-10,5,ball.x,ball.y,ball.r);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.3, colors[mode][0]); g.addColorStop(1,'#0f172a');
  ctx.fillStyle=g; ctx.shadowBlur=30; ctx.shadowColor=colors[mode][0]; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='white'; ctx.font='22px Arial'; ctx.textAlign='center'; ctx.fillText(mode==='fire'?'🔥':mode==='ice'?'❄️':'🪐',ball.x,ball.y+8);
  parts=parts.filter(p=>p.life>0); parts.forEach(p=>{p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life-=0.02; ctx.globalAlpha=p.life; ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();}); ctx.globalAlpha=1;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
