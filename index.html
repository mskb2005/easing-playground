<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#020617;color:#fff;font-family:Arial;overflow:hidden;text-align:center}h1{margin:14px 0 2px;font-size:22px}h1 span{color:#38bdf8}p{font-size:12px;color:#94a3b8}#box{background:#0f172a;margin:10px;padding:14px;border-radius:14px}canvas{background:#020617}</style></head>
<body>
<h1>WORLD <span>GLOBE</span></h1><p>Drag to spin • Tap a dot</p>
<canvas id="c" width="360" height="360"></canvas>
<div id="box"><b id="city">👆 Drag the globe</b><div id="desc" style="font-size:13px;color:#cbd5e1">Tap yellow dot = capital</div></div>
<script>
c=document.getElementById('c');x=c.getContext('2d');
caps=[["Colombo","Sri Lanka",6.9,79.8],["New Delhi","India",28.6,77.2],["Tokyo","Japan",35.6,139.6],["London","UK",51.5,0],["Paris","France",48.8,2.3],["New York / Washington","USA",38.9,-77],["Beijing","China",39.9,116.4],["Cairo","Egypt",30,31.2],["Sydney / Canberra","Australia",-35.2,149.1],["Moscow","Russia",55.7,37.6]];
let rot=0,drag=false,lx=0,sel=null;
c.onpointerdown=e=>{drag=true;lx=e.clientX;};
onpointermove=e=>{if(drag)rot+=(e.clientX-lx)*0.01;lx=e.clientX;};
onpointerup=()=>drag=false;
c.onclick=e=>{
 let r=c.getBoundingClientRect(),mx=e.clientX-r.left-180,my=e.clientY-r.top-180;
 caps.forEach(cap=>{let lon=(cap[3]+rot*57)*Math.PI/180,lat=cap[2]*Math.PI/180;
 let px=Math.cos(lat)*Math.sin(lon)*140,py=-Math.sin(lat)*140;
 if(Math.hypot(mx-px,my-py)<18){sel=cap;document.getElementById('city').textContent="📍 "+cap[0];document.getElementById('desc').textContent="Capital of "+cap[1];}});
};
function f(){x.clearRect(0,0,360,360);x.strokeStyle="#38bdf8";x.lineWidth=1;
 x.beginPath();x.arc(180,180,140,0,7);x.stroke();
 for(let i=-60;i<=60;i+=30){x.beginPath();x.ellipse(180,180,140,140*Math.cos(i*Math.PI/180)*0.9+10,0,0,7);x.stroke();}
 caps.forEach(cap=>{
  let lon=(cap[3]+rot*57)*Math.PI/180,lat=cap[2]*Math.PI/180;
  let px=180+Math.cos(lat)*Math.sin(lon)*140,py=180-Math.sin(lat)*140;
  let front=Math.cos(lat)*Math.cos(lon)>0;
  if(front){x.fillStyle=cap[1]=="Sri Lanka"?"#22ff88":"#facc15";x.beginPath();x.arc(px,py,6,0,7);x.fill();}});
 if(!drag)rot+=0.002;requestAnimationFrame(f);}f();
</script></body></html>
